name: Update weekly literature

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * 1'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: weekly-literature-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Crossref and bioRxiv records
        run: node scripts/fetch-data.mjs
      - name: Commit updated data
        run: |
          git config user.name 'synbio-desk-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data.json
          git diff --cached --quiet || git commit -m "chore: update weekly literature"
          git push
